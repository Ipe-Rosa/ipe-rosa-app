<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin de Produtos - IPÊ ROSA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>IPÊ ROSA</h1>
    <p>Cadastro de produtos</p>
  </header>

  <main>
    <section class="auth-box" style="max-width:500px;">
      <form id="form-produto" class="auth-form">
        <label for="nome">Nome do produto</label>
        <input type="text" id="nome" required>

        <label for="categoria">Categoria</label>
        <select id="categoria" required>
          <option value="">Selecione...</option>
          <option value="bolsas">Bolsas de pano</option>
          <option value="roupas">Roupas femininas</option>
          <option value="necessaire">Necessaire</option>
          <option value="almofada">Almofada</option>
          <option value="acessorios">Acessórios femininos</option>
          <option value="pet">Brinquedos de pano pet</option>
        </select>

        <label for="descricao">Descrição</label>
        <textarea id="descricao" rows="3" style="padding:10px; border:1px solid #ddd; border-radius:6px;"></textarea>

        <label for="preco">Preço (R$)</label>
        <input type="number" id="preco" step="0.01" required>

        <label for="foto">Foto do produto</label>
        <input type="file" id="foto" accept="image/*">
        <img id="preview" class="preview-foto" style="display:none;">

        <label style="display:flex; align-items:center; gap:8px; margin-top:12px;">
          <input type="checkbox" id="disponivel" checked style="width:auto;"> Disponível para venda
        </label>

        <button type="submit" class="btn-primary">Salvar produto</button>
        <p id="produto-mensagem" class="mensagem"></p>
      </form>
    </section>

    <section class="auth-box" style="max-width:700px; margin-top:20px;">
      <h2 style="font-size:1.1rem; color:#d46a8f;">Produtos cadastrados</h2>
      <div id="lista-produtos">Carregando...</div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 IPÊ ROSA. Todos os direitos reservados.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin-produtos.js"></script>
</body>
</html>
